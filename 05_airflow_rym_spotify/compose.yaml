# Laboratorio local autónomo: Airflow (8080), MLflow (5001) y worker interno.
# Puertos expuestos solo en el equipo local. No publicar estos servicios en internet.
services:
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    restart: unless-stopped
    volumes:
      - mlflow_state:/mlflow-data
    ports:
      - "127.0.0.1:5001:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./resultados:/workspace/resultados
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  airflow:
    image: apache/airflow:3.3.1-python3.11
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__API__BASE_URL: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - airflow_state:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mlflow_state:
  airflow_state:
